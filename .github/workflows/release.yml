name: Release
on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            - name: Run release-please
              uses: googleapis/release-please-action@v5
              with:
                  # PAT so the release PR triggers the build workflow. The
                  # default GITHUB_TOKEN would work too, but PRs it opens do
                  # not trigger other workflows (e.g. Build and Test).
                  token: ${{ secrets.RELEASE_TOKEN }}
